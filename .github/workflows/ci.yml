name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the run for its old commit. Pushes to main are
# never cancelled, so every merge deploys.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The walkthrough check needs the branch tip and its merge base with main.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - run: npm run typecheck

      - run: npm run lint

      - name: Tests (unit + browser in Chromium and Firefox)
        run: npm test

      # The v8 gate runs on the unit project only (the pure core); the unit
      # tests are fast, so running them twice is cheap.
      - name: Coverage gate
        run: npm run coverage

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-screenshots
          path: .vitest/attachments/failure-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - run: npm run build

      # Part of `check`, the status the ruleset requires. It also runs on a manual
      # dispatch of a branch, whose `check` would otherwise pass without it.
      - name: Walkthrough
        if: github.ref != 'refs/heads/main'
        env:
          TIP: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node docs/walkthroughs/check.js "$TIP"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # The required browsers on their real platforms. Only the browser tests run
  # here: typecheck, lint, coverage and build give the same result on any OS,
  # so `check` covers them once. Runs on PRs only; the merge was already tested.
  cross-browser:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      # The ruleset on main requires each job by its exact name, which includes
      # `os` and `browsers`. After changing either, update the required checks
      # (Settings > Rules), or PRs wait forever for a check that never reports.
      matrix:
        include:
          # Chrome and Edge come preinstalled on GitHub's runners; only
          # Firefox is downloaded.
          - os: windows-latest
            browsers: chrome,msedge,firefox
          - os: macos-latest
            browsers: chrome,firefox
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - id: playwright
        shell: bash
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-firefox

      - run: npx playwright install firefox

      - name: Browser tests (${{ matrix.browsers }})
        env:
          BROWSERS: ${{ matrix.browsers }}
        run: npm run test:browser

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-screenshots-${{ matrix.os }}
          path: .vitest/attachments/failure-screenshots/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
