name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The walkthrough check needs the branch tip and its merge base with main.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - run: npm run typecheck

      - run: npm run lint

      - name: Tests (unit + browser in Chromium and Firefox)
        run: npm test

      # The v8 gate runs on the unit project only (the pure core); the unit
      # tests are fast, so running them twice is cheap.
      - name: Coverage gate
        run: npm run coverage

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-screenshots
          path: .vitest/attachments/failure-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - run: npm run build

      # Part of `check`, the status the ruleset requires. It also runs on a manual
      # dispatch of a branch, whose `check` would otherwise pass without it.
      - name: Walkthrough
        if: github.ref != 'refs/heads/main'
        env:
          TIP: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node docs/walkthroughs/check.js "$TIP"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
